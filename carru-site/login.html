<!DOCTYPE html>

    </div>

            <form>
                <div class="input">

                    </div>
                    <div class="esqueci">
                        <p><a href="#">Esqueci a senha</a></p>
                    </div>
                </div>
                <button type="submit">Enviar</button>
                <div class="container-cadastro">
                    <div class="cadastro">
                        <a href="#">Cadastrar-se</a>
                    </div>
